name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quality gate only. Building and deploying the Worker is Workers Builds'
# job — see "Continuous Deployment" in the README.
jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Svelte check
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Runs last: the config points at web/build, so the assets have to exist
      # before wrangler will resolve it.
      - name: Validate Workers config
        run: bunx wrangler deploy --dry-run

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
