name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quality gate only. Deploying the Workers is Workers Builds' job, on
# Cloudflare's minutes — see "Continuous Deployment" in the README.
jobs:
  workers:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      # Each package's typecheck runs `cf workers types` first, generating the
      # Env and runtime types from its cloudflare.config.ts.
      - name: Type check
        run: bun run typecheck

      - name: Svelte check
        run: bun run --cwd instance check

      - name: Test
        run: bun test

      - name: Build instance UI
        run: bun run --cwd instance build

      # Runs last: the instance config points at web/build, so the assets have
      # to exist before cf will resolve it.
      # The instance's own config is each owner's and not in the repo; the
      # example stands in for it.
      - name: Validate Workers config
        run: bun run --filter '*' deploy:dry
        env:
          IGLOO_CONFIG: igloo.config.example.json

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
